[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "A Probabilistic Consensus-State Server with Observer-Driven Collapse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pydantic",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
